{{ define "main" }}
<section class="max-w-5xl mx-auto px-6 py-14">
  <h1 class="text-3xl font-extrabold mb-6">{{ .Title }}</h1>
  <div class="grid md:grid-cols-2 gap-6">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="citrus-glass rounded-2xl p-6 block hover:border-og-amber transition">
        <div class="text-xs font-mono text-og-citrus mb-1">{{ .RelPermalink }}</div>
        <h2 class="text-xl font-bold mb-2">{{ .Title }}</h2>
        <p class="text-sm text-og-muted">{{ .Description }}</p>
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
