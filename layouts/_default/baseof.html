<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <link rel="icon" type="image/png" href="/images/orangegel-icon-1024.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            og: {
              bg: '#0C0D12',
              surface: '#13151F',
              panel: '#1A1D2B',
              border: '#282C3E',
              amber: '#FF8A00',
              citrus: '#FFB800',
              emerald: '#10B981',
              text: '#F4F6FB',
              muted: '#94A3B8'
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" defer></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
  <style>
    body {
      background-color: #0C0D12;
      color: #F4F6FB;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif;
    }
    .citrus-glass {
      background: rgba(26, 29, 43, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 138, 0, 0.22);
    }
    .citrus-glow {
      box-shadow: 0 0 48px -12px rgba(255, 138, 0, 0.38);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-og-amber selection:text-og-bg">
  <!-- Citrus Hydrogel Top Bar -->
  <header class="sticky top-0 z-50 citrus-glass border-b border-og-border/80">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <img src="/images/orangegel-icon-1024.png" alt="OrangeGel Icon" class="w-9 h-9 rounded-xl shadow-lg group-hover:scale-105 transition" />
        <div>
          <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-og-amber via-og-citrus to-amber-200 bg-clip-text text-transparent">
            OrangeGel
          </span>
          <span class="ml-2 text-[11px] font-mono px-2 py-0.5 rounded-full bg-og-panel border border-og-amber/40 text-og-citrus">
            v0.1.0 · Tauri v2
          </span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm text-og-muted">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="hover:text-og-citrus transition font-medium">{{ .Name }}</a>
        {{ end }}
      </nav>

      <div class="flex items-center gap-3">
        <a href="https://github.com/orangegel/orangegel" target="_blank" rel="noopener"
           class="px-3.5 py-1.5 rounded-lg bg-og-panel border border-og-border hover:border-og-amber text-xs font-semibold text-og-text transition">
          GitHub · orangegel/orangegel
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="border-t border-og-border/70 bg-og-surface/80 py-10 mt-20">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-og-muted">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-og-amber"></span>
        <span>OrangeGel Studio — Native Rust + Tauri v2 + Angular 19 Static Site IDE (Successor to LycheeBox)</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="https://github.com/orangegel/orangegel" class="hover:text-og-citrus">App Repo</a>
        <a href="https://github.com/orangegel/site" class="hover:text-og-citrus">Site Repo</a>
        <a href="https://github.com/orangegel/docs" class="hover:text-og-citrus">Docs Repo</a>
      </div>
    </div>
  </footer>
</body>
</html>
