<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}OrangeGel — Native macOS Static Site Studio{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/images/orangegel-icon-1024.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            og: {
              bg: '#0C0D12',
              surface: '#13151F',
              panel: '#1A1D2B',
              border: '#282C3E',
              amber: '#FF8A00',
              citrus: '#FFB800',
              emerald: '#10B981',
              text: '#F4F6FB',
              muted: '#94A3B8'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0C0D12;
      color: #F4F6FB;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif;
    }
    .citrus-glass {
      background: rgba(26, 29, 43, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 138, 0, 0.22);
    }
    .citrus-glow {
      box-shadow: 0 0 64px -8px rgba(255, 138, 0, 0.42);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-og-amber selection:text-og-bg">
  {{ if not .IsHome }}
  <header class="sticky top-0 z-50 citrus-glass border-b border-og-border/80">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <img src="/images/orangegel-icon-1024.png" alt="OrangeGel Icon" width="36" height="36" class="w-9 h-9 rounded-xl shadow-lg group-hover:scale-105 transition" />
        <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-og-amber via-og-citrus to-amber-200 bg-clip-text text-transparent">
          OrangeGel
        </span>
      </a>
      <div class="flex items-center gap-3">
        <a href="https://github.com/orangegel/orangegel" target="_blank" rel="noopener"
           class="px-3.5 py-1.5 rounded-lg bg-og-panel border border-og-border hover:border-og-amber text-xs font-semibold text-og-text transition">
          GitHub
        </a>
      </div>
    </div>
  </header>
  {{ end }}

  <main class="flex-1 flex flex-col">
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
